# 매일 아침 6시 무렵(한국 시간)에 날씨를 자동으로 수집하는 설정
name: 날씨 자동 수집

on:
  schedule:
    - cron: "17 21 * * *"   # 세계표준시 21:17 = 한국 시간 06:17
  workflow_dispatch:        # 버튼으로 바로 실행할 수 있게 함

permissions:
  contents: write           # 수집한 결과 파일을 저장(커밋)할 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날씨 수집
        run: python scripts/collect.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "날씨 데이터 업데이트"
          git push
